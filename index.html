<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>衣格人格 Wear Your Persona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="home-page" class="page active">
      <p class="eyebrow">Style Quiz</p>
      <h1>衣格人格<br><span>Wear Your Persona</span></h1>
      <p class="intro">用 10 題簡單選擇，找出最接近你的穿搭人格。</p>
      <button id="start-btn" class="primary-btn" type="button">開始測驗</button>
    </section>

    <section id="quiz-page" class="page">
      <div class="quiz-header">
        <p id="question-count" class="eyebrow">Question 1 / 10</p>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
      <h2 id="question-title"></h2>
      <div id="options" class="options"></div>
    </section>

    <section id="loading-page" class="page">
      <div class="loader"></div>
      <h2>分析你的衣格人格中...</h2>
      <p class="intro">正在整理你的風格偏好。</p>
    </section>

    <section id="result-page" class="page">
      <p class="eyebrow">Your Persona</p>
      <h2 id="result-title"></h2>
      <p id="result-description" class="intro"></p>
      <button id="restart-btn" class="primary-btn" type="button">重新測驗</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
